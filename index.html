<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter WEB</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/icons/tv-2.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            // In local development (Live Server / localhost), unregister service workers to avoid reload loops
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    for (const registration of registrations) {
                        registration.unregister();
                    }
                });
            } else {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js')
                        .then(registration => console.log('SW registered:', registration))
                        .catch(error => console.log('SW registration failed:', error));
                });
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #000;
            color: white;
            overflow: hidden;
            /* Prevent body scroll, handle inside app */
        }

        /* Custom scrollbar for the editor */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: #1f2937;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        /* Marker overlay gradient */
        .gradient-overlay-top {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .gradient-overlay-bottom {
            background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%);
        }

        /* Smooth text rendering */
        .prompter-text {
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        /* Highlight placeholders like [Tu Nombre] */
        .highlight-placeholder {
            color: #fbbf24;
            /* Amber-400 */
            font-weight: bold;
            background-color: rgba(251, 191, 36, 0.1);
            padding: 0 4px;
            border-radius: 4px;
        }

        /* Block headers in text */
        .block-header {
            color: #f87171;
            /* Red-400 (INACAP vibe) */
            font-weight: bold;
            display: block;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            font-size: 0.6em;
            /* Smaller relative to main text */
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid #7f1d1d;
        }

        /* Active word tracking in prompter */
        .prompter-word {
            display: inline-block;
            transition: color 0.15s ease, background-color 0.15s ease;
            border-radius: 4px;
            padding: 0 2px;
            cursor: pointer;
        }

        .prompter-word.active-word {
            color: #fef08a; /* yellow-200 */
            background-color: rgba(239, 68, 68, 0.35); /* red-500 tint */
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        @keyframes pulse-mic {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }
        }

        .animate-mic-listening {
            animation: pulse-mic 1.6s infinite;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const TRANSLATIONS = {
            en: {
                title: "PROMPTER",
                play: "Play/Pause (Space)",
                restart: "Restart",
                speed: "Speed",
                slow: "Slow",
                fast: "Fast",
                fontSize: "Size",
                mirror: "Mirror Mode",
                edit: "Edit Script",
                editorTitle: "Edit Script (HTML allowed)",
                insert: "Insert...",
                saveClose: "Save & Close",
                insertTitle: "Insert Element",
                newBlock: "[block] New Block",
                variable: "[Variable] Marker",
                paragraph: "(Enter) New Paragraph",
                modalBlockTitle: "New Block",
                modalBlockPlaceholder: "Block Title...",
                modalVarTitle: "New Variable",
                modalVarPlaceholder: "Variable Name...",
                cancel: "Cancel",
                confirm: "Insert",
                shortcuts: "Shortcuts:",
                shortcutBlock: "[block] Title",
                shortcutBlockDesc: ": Creates a section header.",
                shortcutVar: "[Text]",
                shortcutVarDesc: ": Highlights text as variable (e.g. [Name]).",
                shortcutEnter: "(Enter)",
                shortcutEnterDesc: ": Creates a new paragraph.",
                voiceTracking: "Voice Tracking (Mic)",
                voiceTrackingListening: "Listening... speak your script",
                voiceTrackingUnsupported: "Speech recognition not supported in this browser. Please use Chrome or Edge.",
                voiceTrackingPermissionDenied: "Microphone permission denied. Enable microphone access in browser settings.",
                reading: "Reading",
                defaultScript: `
[block] Welcome to Teleprompter
This is an example text. You can edit it by clicking the settings button (gear icon).

[block] Quick Instructions
1. Use [block] Title to create red section headers.
2. Use [Variable] to highlight text you need to customize (e.g. [Your Name]).
3. Press (Space) to start/pause scrolling.
4. Use Up/Down arrows to adjust speed.
5. Click the microphone button to activate Voice Tracking!

Delete this text and start writing your script!
                `.trim()
            },
            es: {
                title: "PROMPTER",
                play: "Reproducir/Pausar (Espacio)",
                restart: "Reiniciar",
                speed: "Velocidad",
                slow: "Lento",
                fast: "Rápido",
                fontSize: "Tamaño",
                mirror: "Modo Espejo",
                edit: "Editar Guion",
                editorTitle: "Editar Guion (HTML permitido)",
                insert: "Insertar...",
                saveClose: "Guardar y Cerrar",
                insertTitle: "Insertar Elemento",
                newBlock: "[bloque] Nuevo Bloque",
                variable: "[Variable] Marcador",
                paragraph: "(Enter) Nuevo Párrafo",
                modalBlockTitle: "Nuevo Bloque",
                modalBlockPlaceholder: "Título del bloque...",
                modalVarTitle: "Nueva Variable",
                modalVarPlaceholder: "Nombre de la variable...",
                cancel: "Cancelar",
                confirm: "Insertar",
                shortcuts: "Atajos:",
                shortcutBlock: "[bloque] Título",
                shortcutBlockDesc: ": Crea un encabezado de sección.",
                shortcutVar: "[Texto]",
                shortcutVarDesc: ": Resalta texto como variable (ej: [Tu Nombre]).",
                shortcutEnter: "(Enter)",
                shortcutEnterDesc: ": Crea un nuevo párrafo.",
                voiceTracking: "Seguimiento por Voz (Mic)",
                voiceTrackingListening: "Escuchando... habla tu guion",
                voiceTrackingUnsupported: "Reconocimiento de voz no soportado en este navegador. Por favor usa Chrome o Edge.",
                voiceTrackingPermissionDenied: "Permiso de micrófono denegado. Permite el acceso al micrófono en la barra de direcciones.",
                reading: "Lectura",
                defaultScript: `
[bloque] Bienvenido al Teleprompter
Este es un texto de ejemplo. Puedes editarlo haciendo clic en el botón de configuración (engranaje).

[bloque] Instrucciones Rápidas
1. Usa [bloque] Título para crear encabezados de sección rojos.
2. Usa [Variable] para resaltar texto que debes personalizar (ej: [Tu Nombre]).
3. Presiona (Espacio) para iniciar o pausar el desplazamiento.
4. Usa las flechas (Arriba/Abajo) para ajustar la velocidad.
5. ¡Haz clic en el micrófono para activar el Seguimiento por Voz!

¡Borra este texto y comienza a escribir tu guion!
                `.trim()
            }
        };

        // Icon Components (Simple SVG implementations)
        const IconPlay = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconPause = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
        const IconRotate = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 21h5v-5"></path></svg>;
        const IconType = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>;
        const IconSettings = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const IconMirror = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h20"></path><path d="m19 9-3-3-3 3"></path><path d="m19 15-3 3-3-3"></path></svg>;
        const IconCoffee = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>;
        const IconMic = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>;
        const IconMicOff = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path><path d="M5 10v2a7 7 0 0 0 12 5"></path><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path><path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>;

        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

        const STOP_WORDS = new Set([
            // Spanish
            'de', 'la', 'el', 'en', 'y', 'a', 'los', 'del', 'se', 'las', 'por', 'un', 'para', 'con', 
            'no', 'una', 'su', 'al', 'lo', 'como', 'pero', 'sus', 'le', 'ya', 'o', 'este', 'si', 
            'esta', 'muy', 'sin', 'sobre', 'me', 'nos', 'te', 'tu', 'mi', 'e', 'ni', 'les', 'eso', 
            'ese', 'esa', 'es', 'son', 'fue', 'era', 'va', 'han', 'hay', 'que', 'dos', 'tres',
            'unos', 'unas', 'otro', 'otra', 'otros', 'otras', 'cual', 'quien', 'tan', 'donde',
            // English
            'the', 'a', 'an', 'and', 'or', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by', 
            'from', 'up', 'about', 'into', 'over', 'after', 'is', 'are', 'was', 'were', 'be', 
            'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did', 'but', 'if', 'not', 
            'no', 'it', 'its', 'he', 'she', 'they', 'we', 'you', 'i', 'my', 'your', 'his', 'her'
        ]);

        const normalizeWord = (w) => {
            if (!w) return '';
            let clean = w.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9]/g, "");
            if (clean === 'zero') clean = 'cero';
            return clean;
        };

        const isStopWord = (word) => {
            return STOP_WORDS.has(word) || word.length <= 2;
        };

        const isWordMatch = (scriptWord, spokenWord) => {
            if (!scriptWord || !spokenWord) return false;
            if (scriptWord === spokenWord) return true;
            if ((scriptWord === 'cero' && spokenWord === 'zero') || (scriptWord === 'zero' && spokenWord === 'cero')) return true;
            // Prefix matching for words with 4+ characters (e.g. "generacion" / "generaciones")
            if (scriptWord.length >= 4 && spokenWord.length >= 4) {
                if (scriptWord.startsWith(spokenWord.slice(0, -1)) || spokenWord.startsWith(scriptWord.slice(0, -1))) {
                    return true;
                }
            }
            return false;
        };

        function App() {
            // State
            const [lang, setLang] = useState(() => localStorage.getItem('teleprompter_lang') || 'en');
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(2); // 1 to 10
            const [fontSize, setFontSize] = useState(64); // px
            const [isMirrored, setIsMirrored] = useState(false);
            const [isEditing, setIsEditing] = useState(false);

            // Voice Tracking State
            const isSpeechSupported = !!SpeechRecognitionAPI;
            const [isVoiceTracking, setIsVoiceTracking] = useState(false);
            const [voiceNotification, setVoiceNotification] = useState(null);

            const [showInsertMenu, setShowInsertMenu] = useState(false);
            const [insertModal, setInsertModal] = useState({ isOpen: false, type: null }); // 'block' | 'variable'
            const [inputValue, setInputValue] = useState('');

            const [text, setText] = useState(() => {
                try {
                    const saved = localStorage.getItem('teleprompter_custom_script');
                    if (saved !== null && saved !== undefined && saved !== '') {
                        return saved;
                    }
                } catch (e) {
                    console.warn('Could not read from localStorage:', e);
                }
                return TRANSLATIONS[lang].defaultScript;
            });

            // Automatically persist script text to localStorage whenever it changes
            useEffect(() => {
                if (text !== undefined && text !== null) {
                    try {
                        localStorage.setItem('teleprompter_custom_script', text);
                    } catch (e) {
                        console.warn('Failed to save script to localStorage:', e);
                    }
                }
            }, [text]);

            // Save on beforeunload to prevent text loss on sudden reload/close
            useEffect(() => {
                const handleBeforeUnload = () => {
                    if (text !== undefined && text !== null) {
                        try {
                            localStorage.setItem('teleprompter_custom_script', text);
                        } catch (e) {}
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, [text]);

            const scrollContainerRef = useRef(null);
            const textareaRef = useRef(null);
            const animationRef = useRef(null);
            const lastTimeRef = useRef(0);

            // Read persisted reading index to restore position across any reloads
            const getSavedWordIndex = () => {
                try {
                    const saved = localStorage.getItem('teleprompter_reading_idx');
                    const num = parseInt(saved, 10);
                    return (!isNaN(num) && num >= 0) ? num : 0;
                } catch (e) {
                    return 0;
                }
            };

            const recognitionRef = useRef(null);
            const isVoiceTrackingRef = useRef(false);
            const isListeningRef = useRef(false);
            const activeWordIndexRef = useRef(getSavedWordIndex());
            const wordsListRef = useRef([]);
            const restartTimeoutRef = useRef(null);
            const networkErrorCountRef = useRef(0);

            // Helper for translations
            const t = (key) => TRANSLATIONS[lang][key] || key;

            // Keep ref updated for event listeners & callbacks
            useEffect(() => {
                isVoiceTrackingRef.current = isVoiceTracking;
            }, [isVoiceTracking]);

            // Update local storage when language changes
            useEffect(() => {
                localStorage.setItem('teleprompter_lang', lang);
                if (isVoiceTrackingRef.current) {
                    // Restart speech recognition cleanly with new language
                    stopVoiceTracking();
                    setTimeout(() => startVoiceTracking(), 300);
                }
            }, [lang]);

            // Tokenize text into words with IDs and clean words for matching, tracking block boundaries
            const { processedHtml, wordsList, blockRanges } = useMemo(() => {
                const words = [];
                const blocks = [];
                let wordCounter = 0;
                let currentBlockIndex = 0;
                let currentBlockStart = 0;

                const lines = text.split('\n');
                const processedLines = lines.map(line => {
                    const trimmed = line.trim();
                    // Section headers: [bloque] or [block]
                    const blockMatch = trimmed.match(/^\[(bloque|block)\]\s*(.*)$/i);
                    if (blockMatch) {
                        if (wordCounter > currentBlockStart) {
                            blocks[currentBlockIndex] = {
                                start: currentBlockStart,
                                end: wordCounter - 1,
                                count: wordCounter - currentBlockStart
                            };
                            currentBlockIndex++;
                            currentBlockStart = wordCounter;
                        }
                        return `<div class="block-header">${blockMatch[2]}</div>`;
                    }

                    // Helper to wrap readable words in span tags with data-word-index and blockIndex
                    const wrapWords = (str) => {
                        return str.replace(/([a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ]+)/g, (match) => {
                            const clean = normalizeWord(match);
                            const currentIdx = wordCounter++;
                            words.push({
                                index: currentIdx,
                                word: clean,
                                original: match,
                                blockIndex: currentBlockIndex
                            });
                            return `<span id="prompter-word-${currentIdx}" class="prompter-word" data-word-index="${currentIdx}">${match}</span>`;
                        });
                    };

                    // Handle [Variable] and normal text segments
                    const segments = line.split(/(\[[^\]]+\])/g);
                    const processedSegments = segments.map(seg => {
                        if (!seg) return '';
                        const varMatch = seg.match(/^\[([^\]]+)\]$/);
                        if (varMatch) {
                            const innerWrapped = wrapWords(varMatch[1]);
                            return `<span class="highlight-placeholder">[${innerWrapped}]</span>`;
                        }
                        return wrapWords(seg);
                    });

                    return processedSegments.join('');
                });

                // Finalize last block range
                if (wordCounter > currentBlockStart) {
                    blocks[currentBlockIndex] = {
                        start: currentBlockStart,
                        end: wordCounter - 1,
                        count: wordCounter - currentBlockStart
                    };
                }

                return {
                    processedHtml: processedLines.join('<br/>'),
                    wordsList: words,
                    blockRanges: blocks
                };
            }, [text]);

            const blockRangesRef = useRef([]);

            useEffect(() => {
                wordsListRef.current = wordsList;
                blockRangesRef.current = blockRanges;
            }, [wordsList, blockRanges]);

            // Restore saved reading position on initial load or reload
            const hasRestoredPositionRef = useRef(false);
            useEffect(() => {
                if (!hasRestoredPositionRef.current && wordsList.length > 0) {
                    hasRestoredPositionRef.current = true;
                    const savedIdx = getSavedWordIndex();
                    if (savedIdx > 0 && savedIdx < wordsList.length) {
                        activeWordIndexRef.current = savedIdx;
                        setTimeout(() => {
                            updateActiveWordInDOM(null, savedIdx);
                            scrollToWord(savedIdx);
                        }, 250);
                    }
                }
            }, [wordsList]);

            // Highlight active word in DOM directly to avoid re-renders
            const updateActiveWordInDOM = (prevIndex, newIndex) => {
                if (prevIndex !== null && prevIndex !== undefined) {
                    const prevEl = document.getElementById(`prompter-word-${prevIndex}`);
                    if (prevEl) prevEl.classList.remove('active-word');
                }
                if (newIndex !== null && newIndex !== undefined) {
                    const newEl = document.getElementById(`prompter-word-${newIndex}`);
                    if (newEl) newEl.classList.add('active-word');
                }
            };

            const scrollTimeoutRef = useRef(null);
            const lastScrollTargetRef = useRef(0);

            // Smooth focal scrolling with throttle to avoid browser scroll interruption/jitter
            const scrollToWord = (targetIndex) => {
                if (!scrollContainerRef.current) return;
                lastScrollTargetRef.current = targetIndex;

                if (scrollTimeoutRef.current) return;

                scrollTimeoutRef.current = setTimeout(() => {
                    scrollTimeoutRef.current = null;
                    const targetEl = document.getElementById(`prompter-word-${lastScrollTargetRef.current}`);
                    if (!targetEl || !scrollContainerRef.current) return;

                    const container = scrollContainerRef.current;
                    const containerRect = container.getBoundingClientRect();
                    const wordRect = targetEl.getBoundingClientRect();

                    const currentScroll = container.scrollTop;
                    const wordOffsetRelativeToContainer = (wordRect.top - containerRect.top) + currentScroll;
                    const targetScrollTop = Math.max(0, wordOffsetRelativeToContainer - (container.clientHeight * 0.28));

                    container.scrollTo({
                        top: targetScrollTop,
                        behavior: 'smooth'
                    });
                }, 90);
            };

            // Voice Tracking Controller with crash-proof lifecycle, instance reuse, and reading persistence
            const createRecognitionInstance = () => {
                if (!isSpeechSupported) return null;

                try {
                    const recognition = new SpeechRecognitionAPI();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = lang === 'es' ? 'es-ES' : 'en-US';

                    recognition.onstart = () => {
                        isListeningRef.current = true;
                        networkErrorCountRef.current = 0;
                        setIsVoiceTracking(true);
                        setVoiceNotification(null);
                    };

                    recognition.onresult = (event) => {
                        try {
                            const list = wordsListRef.current;
                            if (!list || list.length === 0) return;

                            let transcript = '';
                            for (let i = event.resultIndex; i < event.results.length; i++) {
                                transcript += ' ' + event.results[i][0].transcript;
                            }

                            const spokenTokens = transcript
                                .trim()
                                .split(/\s+/)
                                .map(normalizeWord)
                                .filter(Boolean);

                            if (spokenTokens.length === 0) return;

                            const curr = activeWordIndexRef.current;
                            const maxLookahead = Math.min(list.length, curr + 22);

                            // Consider the most recent spoken words (up to last 6)
                            const recentSpoken = spokenTokens.slice(-6);

                            // Current block boundary tracking
                            const currWordObj = list[curr];
                            const currentBlock = currWordObj && currWordObj.blockIndex !== undefined ? currWordObj.blockIndex : 0;
                            const currentRange = blockRangesRef.current[currentBlock];

                            // Allowed to transition to another block ONLY if speaker is at the end of current block (within last 5 words)
                            const isNearBlockEnd = currentRange
                                ? (currentRange.end - curr <= 5)
                                : true;

                            // Helper to check if script word at index idx matches any recent spoken word
                            const getMatchInRecent = (idx) => {
                                if (idx < 0 || idx >= list.length) return null;
                                const sWord = list[idx].word;
                                for (let k = 0; k < recentSpoken.length; k++) {
                                    if (isWordMatch(sWord, recentSpoken[k])) {
                                        return { scriptIdx: idx, spokenIdx: k, word: sWord, isStop: isStopWord(sWord) };
                                    }
                                }
                                return null;
                            };

                            let bestTargetIndex = -1;
                            let highestScore = 0;

                            // Scan candidate positions ahead of current index
                            for (let j = curr; j < maxLookahead; j++) {
                                // BLOCK-BOUNDARY PROTECTION:
                                // If a candidate belongs to a future block, reject it unless we are near the end of the current block,
                                // and never skip an entire block ahead!
                                const candWordObj = list[j];
                                const candidateBlock = candWordObj && candWordObj.blockIndex !== undefined ? candWordObj.blockIndex : currentBlock;

                                if (candidateBlock > currentBlock) {
                                    if (!isNearBlockEnd) {
                                        continue; // Still inside current block, jumping to future block is forbidden
                                    }
                                    if (candidateBlock > currentBlock + 1) {
                                        continue; // Even at block end, skipping a whole block is forbidden
                                    }
                                }

                                const match = getMatchInRecent(j);
                                if (!match) continue;

                                let score = 0;

                                if (match.isStop) {
                                    // CRITICAL STOPWORD PROTECTION:
                                    // Short/stop words ("de", "la", "el", "un", "y") can NEVER leap far ahead on their own!
                                    const isNear = (j <= curr + 2);
                                    const prevMatch = getMatchInRecent(j - 1);
                                    const nextMatch = getMatchInRecent(j + 1);
                                    const hasAdjacentMatch = !!(prevMatch || nextMatch);

                                    if (hasAdjacentMatch) {
                                        score = 3;
                                    } else if (isNear) {
                                        score = 1;
                                    } else {
                                        score = 0;
                                    }
                                } else {
                                    // CONTENT WORD:
                                    score = 4;
                                    const prevMatch = getMatchInRecent(j - 1);
                                    const nextMatch = getMatchInRecent(j + 1);
                                    if (prevMatch || nextMatch) {
                                        score += 3; // Consecutive phrase bonus
                                    }
                                }

                                if (score > 0) {
                                    if (j >= bestTargetIndex && score >= highestScore) {
                                        bestTargetIndex = j;
                                        highestScore = score;
                                    }
                                }
                            }

                            if (bestTargetIndex > curr) {
                                const prev = activeWordIndexRef.current;
                                activeWordIndexRef.current = bestTargetIndex;
                                // Update DOM directly without forcing full React re-renders!
                                updateActiveWordInDOM(prev, bestTargetIndex);
                                scrollToWord(bestTargetIndex);
                                try {
                                    localStorage.setItem('teleprompter_reading_idx', bestTargetIndex.toString());
                                } catch (e) {}
                            }
                        } catch (err) {
                            console.error('Error processing speech recognition result:', err);
                        }
                    };

                    recognition.onerror = (event) => {
                        console.warn('Speech recognition error:', event.error);
                        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                            setVoiceNotification(t('voiceTrackingPermissionDenied'));
                            stopVoiceTracking();
                        } else if (event.error === 'network') {
                            networkErrorCountRef.current += 1;
                            if (networkErrorCountRef.current >= 4) {
                                setVoiceNotification(lang === 'es' 
                                    ? 'Error de conexión con el servicio de voz. Revisa tu internet.' 
                                    : 'Speech recognition network error. Check internet connection.');
                                stopVoiceTracking();
                            }
                        }
                    };

                    recognition.onend = () => {
                        isListeningRef.current = false;
                        // Avoid synchronous restart loops that cause Chrome audio renderer to crash or reload the page!
                        if (isVoiceTrackingRef.current) {
                            if (restartTimeoutRef.current) clearTimeout(restartTimeoutRef.current);
                            restartTimeoutRef.current = setTimeout(() => {
                                if (isVoiceTrackingRef.current && !isListeningRef.current) {
                                    try {
                                        if (recognitionRef.current) {
                                            recognitionRef.current.start();
                                        }
                                    } catch (e) {
                                        restartRecognition();
                                    }
                                }
                            }, 600);
                        } else {
                            setIsVoiceTracking(false);
                        }
                    };

                    return recognition;
                } catch (err) {
                    console.error('Failed to instantiate speech recognition:', err);
                    setVoiceNotification(t('voiceTrackingUnsupported'));
                    setIsVoiceTracking(false);
                    isVoiceTrackingRef.current = false;
                    return null;
                }
            };

            const restartRecognition = () => {
                if (recognitionRef.current) {
                    try {
                        recognitionRef.current.onstart = null;
                        recognitionRef.current.onresult = null;
                        recognitionRef.current.onerror = null;
                        recognitionRef.current.onend = null;
                        recognitionRef.current.abort();
                    } catch (e) {}
                    recognitionRef.current = null;
                }
                recognitionRef.current = createRecognitionInstance();
                if (recognitionRef.current && isVoiceTrackingRef.current) {
                    try {
                        recognitionRef.current.start();
                    } catch (e) {
                        console.error('Failed to restart recognition:', e);
                    }
                }
            };

            const startVoiceTracking = () => {
                if (!isSpeechSupported) {
                    setVoiceNotification(t('voiceTrackingUnsupported'));
                    return;
                }

                setIsPlaying(false);
                isVoiceTrackingRef.current = true;
                networkErrorCountRef.current = 0;

                if (!recognitionRef.current) {
                    recognitionRef.current = createRecognitionInstance();
                }

                if (recognitionRef.current && !isListeningRef.current) {
                    try {
                        recognitionRef.current.start();
                    } catch (e) {
                        restartRecognition();
                    }
                }
            };

            const stopVoiceTracking = () => {
                setIsVoiceTracking(false);
                isVoiceTrackingRef.current = false;
                isListeningRef.current = false;
                if (restartTimeoutRef.current) {
                    clearTimeout(restartTimeoutRef.current);
                    restartTimeoutRef.current = null;
                }
                if (recognitionRef.current) {
                    try {
                        recognitionRef.current.stop();
                    } catch (e) {}
                }
            };

            const toggleVoiceTracking = () => {
                if (isVoiceTracking) {
                    stopVoiceTracking();
                } else {
                    startVoiceTracking();
                }
            };

            // Clean up recognition on unmount
            useEffect(() => {
                return () => {
                    stopVoiceTracking();
                };
            }, []);

            // Handle tab visibility to avoid background audio driver issues
            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden && isVoiceTrackingRef.current) {
                        stopVoiceTracking();
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, []);

            // Scroll Logic (Manual Mode)
            const animate = (time) => {
                if (!isPlaying) return;

                const delta = time - lastTimeRef.current;

                if (delta > 16) { // Cap at ~60fps logic
                    if (scrollContainerRef.current) {
                        const pixelMove = (speed * 0.5) * (delta / 16);
                        scrollContainerRef.current.scrollTop += pixelMove;
                    }
                    lastTimeRef.current = time;
                }

                animationRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                if (isPlaying) {
                    lastTimeRef.current = performance.now();
                    animationRef.current = requestAnimationFrame(animate);
                } else {
                    cancelAnimationFrame(animationRef.current);
                }
                return () => cancelAnimationFrame(animationRef.current);
            }, [isPlaying, speed]);

            // Keyboard Shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (isEditing) return; // Don't trigger shortcuts while editing text

                    if (e.code === 'Space') {
                        e.preventDefault();
                        if (isVoiceTrackingRef.current) {
                            stopVoiceTracking();
                        } else {
                            setIsPlaying(prev => !prev);
                        }
                    } else if (e.code === 'ArrowUp') {
                        e.preventDefault();
                        setSpeed(prev => Math.min(prev + 1, 10));
                    } else if (e.code === 'ArrowDown') {
                        e.preventDefault();
                        setSpeed(prev => Math.max(prev - 1, 1));
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isEditing]);

            const handleRestart = () => {
                setIsPlaying(false);
                if (scrollTimeoutRef.current) {
                    clearTimeout(scrollTimeoutRef.current);
                    scrollTimeoutRef.current = null;
                }
                const prev = activeWordIndexRef.current;
                activeWordIndexRef.current = 0;
                updateActiveWordInDOM(prev, null);
                try {
                    localStorage.setItem('teleprompter_reading_idx', '0');
                } catch (e) {}

                if (scrollContainerRef.current) {
                    scrollContainerRef.current.scrollTop = 0;
                }
            };

            const insertText = (textToInsert) => {
                if (!textareaRef.current) return;

                const textarea = textareaRef.current;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const currentText = text;

                const newText = currentText.substring(0, start) + textToInsert + currentText.substring(end);
                setText(newText);
                setShowInsertMenu(false);

                // Restore focus and cursor position after insertion (next tick)
                setTimeout(() => {
                    textarea.focus();
                    textarea.selectionStart = textarea.selectionEnd = start + textToInsert.length;
                }, 0);
            };

            const handleInsertRequest = (type) => {
                setInsertModal({ isOpen: true, type });
                setInputValue('');
                setShowInsertMenu(false);
            };

            const confirmInsert = () => {
                if (!insertModal.type) return;

                let textToInsert = '';
                // Use localized tag based on current language
                const blockTag = lang === 'es' ? 'bloque' : 'block';

                if (insertModal.type === 'block') {
                    textToInsert = `\n[${blockTag}] ${inputValue}\n`;
                } else if (insertModal.type === 'variable') {
                    textToInsert = `[${inputValue}]`;
                }

                insertText(textToInsert);
                setInsertModal({ isOpen: false, type: null });
            };

            return (
                <div className="flex flex-col h-screen font-sans">

                    {/* Toolbar */}
                    <div className="bg-gray-900 border-b border-gray-800 p-4 flex flex-wrap items-center justify-between gap-4 z-50 shadow-lg">
                        <div className="flex items-center gap-4">
                            <span className="text-red-500 font-bold text-xl tracking-tighter">{t('title')}</span>

                            {/* Language Selector */}
                            <select
                                value={lang}
                                onChange={(e) => {
                                    const newLang = e.target.value;
                                    setLang(newLang);
                                    const trimmed = (text || '').trim();
                                    const isDefaultEn = trimmed === TRANSLATIONS.en.defaultScript.trim();
                                    const isDefaultEs = trimmed === TRANSLATIONS.es.defaultScript.trim();
                                    // Only reset to demo text if user hasn't written/customized their own script
                                    if (!trimmed || isDefaultEn || isDefaultEs) {
                                        setText(TRANSLATIONS[newLang].defaultScript);
                                    }
                                }}
                                className="bg-gray-800 text-gray-300 text-xs rounded border border-gray-700 px-2 py-1 focus:outline-none focus:border-red-500"
                            >
                                <option value="en">English</option>
                                <option value="es">Español</option>
                            </select>
                        </div>

                        {/* Controls */}
                        <div className="flex items-center gap-4 bg-gray-800 rounded-full px-5 py-2">
                            {/* Play/Pause */}
                            <button
                                onClick={() => {
                                    if (isVoiceTracking) stopVoiceTracking();
                                    setIsPlaying(!isPlaying);
                                }}
                                className={`p-3 rounded-full transition-all ${isPlaying ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'}`}
                                title={t('play')}
                            >
                                {isPlaying ? <IconPause className="text-white" /> : <IconPlay className="text-white ml-1" />}
                            </button>

                            {/* Voice Tracking */}
                            <button
                                onClick={toggleVoiceTracking}
                                className={`p-3 rounded-full transition-all relative ${
                                    isVoiceTracking
                                        ? 'bg-red-600 hover:bg-red-700 animate-mic-listening text-white'
                                        : !isSpeechSupported
                                        ? 'bg-gray-700 text-gray-500 cursor-not-allowed opacity-50'
                                        : 'bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white'
                                }`}
                                title={
                                    !isSpeechSupported
                                        ? t('voiceTrackingUnsupported')
                                        : isVoiceTracking
                                        ? t('voiceTrackingListening')
                                        : t('voiceTracking')
                                }
                                disabled={!isSpeechSupported}
                            >
                                {isVoiceTracking ? <IconMic /> : (!isSpeechSupported ? <IconMicOff /> : <IconMic />)}
                            </button>

                            {/* Restart */}
                            <button onClick={handleRestart} className="text-gray-400 hover:text-white" title={t('restart')}>
                                <IconRotate size={20} />
                            </button>

                            <div className="h-6 w-px bg-gray-600 mx-2"></div>

                            {/* Speed */}
                            <div className="flex flex-col items-center w-32">
                                <div className="flex justify-between w-full text-xs text-gray-400 mb-1">
                                    <span>{t('slow')}</span>
                                    <span>{t('fast')}</span>
                                </div>
                                <input
                                    type="range"
                                    min="1"
                                    max="10"
                                    step="0.5"
                                    value={speed}
                                    onChange={(e) => setSpeed(Number(e.target.value))}
                                    className="w-full accent-red-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                                />
                                <span className="text-xs text-red-400 font-mono mt-1">{t('speed')}: {speed}x</span>
                            </div>

                            <div className="h-6 w-px bg-gray-600 mx-2"></div>

                            {/* Font Size */}
                            <div className="flex items-center gap-2">
                                <IconType size={18} className="text-gray-400" />
                                <input
                                    type="range"
                                    min="30"
                                    max="120"
                                    value={fontSize}
                                    onChange={(e) => setFontSize(Number(e.target.value))}
                                    className="w-24 accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                                />
                                <span className="text-xs text-blue-400 font-mono w-8">{fontSize}px</span>
                            </div>
                        </div>

                        {/* Extra Actions */}
                        <div className="flex items-center gap-3">
                            <button
                                onClick={() => setIsMirrored(!isMirrored)}
                                className={`p-2 rounded-lg border ${isMirrored ? 'bg-blue-900 border-blue-500 text-blue-200' : 'border-gray-700 text-gray-400 hover:text-white'}`}
                                title={t('mirror')}
                            >
                                <IconMirror size={20} />
                            </button>

                            <button
                                onClick={() => setIsEditing(!isEditing)}
                                className={`p-2 rounded-lg border ${isEditing ? 'bg-yellow-900 border-yellow-500 text-yellow-200' : 'border-gray-700 text-gray-400 hover:text-white'}`}
                                title={t('edit')}
                            >
                                <IconSettings size={20} />
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="relative flex-1 bg-black overflow-hidden">

                        {/* Editor Modal */}
                        {isEditing && (
                            <div className="absolute inset-0 z-40 bg-gray-900 flex flex-col p-8">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-white">{t('editorTitle')}</h2>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setShowInsertMenu(true)}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded flex items-center gap-2"
                                        >
                                            <IconType size={16} /> {t('insert')}
                                        </button>
                                        <button
                                            onClick={() => setIsEditing(false)}
                                            className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded"
                                        >
                                            {t('saveClose')}
                                        </button>
                                    </div>
                                </div>

                                <div className="relative flex-1 flex flex-col">
                                    <textarea
                                        ref={textareaRef}
                                        className="flex-1 w-full bg-gray-800 text-white p-4 font-mono text-sm rounded border border-gray-700 focus:border-red-500 focus:outline-none custom-scroll"
                                        value={text}
                                        onChange={(e) => setText(e.target.value)}
                                    />

                                    {/* Insert Menu Popup */}
                                    {showInsertMenu && (
                                        <div className="absolute top-4 right-4 bg-gray-800 border border-gray-600 rounded-lg shadow-xl p-2 z-50 w-64">
                                            <div className="flex justify-between items-center mb-2 px-2 border-b border-gray-700 pb-2">
                                                <span className="text-sm font-bold text-gray-300">{t('insertTitle')}</span>
                                                <button onClick={() => setShowInsertMenu(false)} className="text-gray-400 hover:text-white">&times;</button>
                                            </div>
                                            <div className="flex flex-col gap-1">
                                                <button
                                                    onClick={() => handleInsertRequest('block')}
                                                    className="text-left px-3 py-2 hover:bg-gray-700 rounded text-sm text-red-300 transition-colors"
                                                >
                                                    {t('newBlock')}
                                                </button>
                                                <button
                                                    onClick={() => handleInsertRequest('variable')}
                                                    className="text-left px-3 py-2 hover:bg-gray-700 rounded text-sm text-yellow-300 transition-colors"
                                                >
                                                    {t('variable')}
                                                </button>
                                                <button
                                                    onClick={() => insertText('\n\n')}
                                                    className="text-left px-3 py-2 hover:bg-gray-700 rounded text-sm text-gray-300 transition-colors"
                                                >
                                                    {t('paragraph')}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Input Modal Overlay */}
                                    {insertModal.isOpen && (
                                        <div className="absolute inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
                                            <div className="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
                                                <h3 className="text-lg font-bold text-white mb-4">
                                                    {insertModal.type === 'block' ? t('modalBlockTitle') : t('modalVarTitle')}
                                                </h3>
                                                <input
                                                    type="text"
                                                    autoFocus
                                                    placeholder={insertModal.type === 'block' ? t('modalBlockPlaceholder') : t('modalVarPlaceholder')}
                                                    className="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white mb-6 focus:border-blue-500 focus:outline-none"
                                                    value={inputValue}
                                                    onChange={(e) => setInputValue(e.target.value)}
                                                    onKeyDown={(e) => e.key === 'Enter' && confirmInsert()}
                                                />
                                                <div className="flex justify-end gap-3">
                                                    <button
                                                        onClick={() => setInsertModal({ isOpen: false, type: null })}
                                                        className="px-4 py-2 text-gray-400 hover:text-white"
                                                    >
                                                        {t('cancel')}
                                                    </button>
                                                    <button
                                                        onClick={confirmInsert}
                                                        className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-medium"
                                                    >
                                                        {t('confirm')}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <p className="mt-2 text-gray-400 text-sm">
                                    {t('shortcuts')}<br />
                                    <span className="font-mono text-red-400">{t('shortcutBlock')}</span> {t('shortcutBlockDesc')}<br />
                                    <span className="font-mono text-yellow-400">{t('shortcutVar')}</span> {t('shortcutVarDesc')}<br />
                                    <span className="font-mono text-gray-400">{t('shortcutEnter')}</span> {t('shortcutEnterDesc')}
                                </p>
                            </div>
                        )}

                        {/* Prompter View */}
                        <div className="relative w-full h-full">

                            {/* Voice Notification Banner */}
                            {voiceNotification && (
                                <div className="absolute top-4 left-1/2 -translate-x-1/2 z-50 bg-red-900/90 border border-red-500 text-red-100 text-sm px-4 py-2 rounded-lg shadow-2xl flex items-center gap-3 backdrop-blur-md">
                                    <span>{voiceNotification}</span>
                                    <button
                                        onClick={() => setVoiceNotification(null)}
                                        className="text-red-300 hover:text-white font-bold ml-2 text-base leading-none"
                                    >
                                        &times;
                                    </button>
                                </div>
                            )}

                            {/* Visual Guides */}
                            <div className="absolute inset-0 pointer-events-none z-20 flex flex-col justify-between">
                                <div className="h-1/3 gradient-overlay-top"></div>
                                {/* Reading Guide Marker */}
                                <div className="flex items-center w-full px-4 opacity-60">
                                    <div className="flex-1 h-px bg-red-600"></div>
                                    <div className="mx-2 text-red-500 text-xs uppercase font-bold tracking-widest bg-black/90 px-3 py-1 border border-red-900 rounded-full flex items-center gap-2">
                                        {isVoiceTracking && (
                                            <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                                        )}
                                        <span>{isVoiceTracking ? t('voiceTrackingListening') : t('reading')}</span>
                                    </div>
                                    <div className="flex-1 h-px bg-red-600"></div>
                                </div>
                                <div className="h-1/3 gradient-overlay-bottom"></div>
                            </div>

                            {/* Scrolling Text Container */}
                            <div
                                ref={scrollContainerRef}
                                className="w-full h-full overflow-y-scroll no-scrollbar scroll-smooth relative z-10"
                                style={{
                                    scrollbarWidth: 'none',
                                    msOverflowStyle: 'none'
                                }}
                            >
                                <div
                                    className={`max-w-4xl mx-auto px-8 py-[50vh] text-center prompter-text transition-transform duration-300 ${isMirrored ? 'scale-x-[-1]' : ''}`}
                                    style={{
                                        fontSize: `${fontSize}px`,
                                        lineHeight: '1.4',
                                        whiteSpace: 'pre-wrap'
                                    }}
                                    onClick={(e) => {
                                        const wordSpan = e.target.closest('.prompter-word');
                                        if (!wordSpan) return;
                                        const idx = parseInt(wordSpan.getAttribute('data-word-index'), 10);
                                        if (!isNaN(idx)) {
                                            const prev = activeWordIndexRef.current;
                                            activeWordIndexRef.current = idx;
                                            updateActiveWordInDOM(prev, idx);
                                            scrollToWord(idx);
                                            try {
                                                localStorage.setItem('teleprompter_reading_idx', idx.toString());
                                            } catch (e) {}
                                        }
                                    }}
                                    dangerouslySetInnerHTML={{ __html: processedHtml }}
                                >
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* Support Button */}
                    <a
                        href="https://buymeacoffee.com/dhenriquez"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="fixed bottom-4 right-4 z-50 bg-yellow-400 hover:bg-yellow-500 text-gray-900 p-3 rounded-full shadow-lg transition-transform hover:scale-110 flex items-center justify-center"
                        title="Buy me a coffee"
                    >
                        <IconCoffee size={24} />
                    </a>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
